spring:
  application:
    name: aiCRM

  autoconfigure:
    exclude:
      # OpenAI starter тягне EmbeddingModel; для pgvector лишаємо лише Google GenAI embeddings
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      # Тимчасово вимикаємо PgVectorStore, щоб при attach файлів не йшли embeddings/LLM виклики назовні
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  threads:
    virtual:
      enabled: true # Важливо для масштабування SSE-з'єднань MCP-сервера

  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 36MB

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

    mcp:
      server:
        enabled: true
        name: aicrm-mcp-server
        version: 1.0.0
        transport: SSE
        sse-endpoint: /mcp/sse
        message-endpoint: /mcp/message

    google:
      genai:
        api-key: ${GEMINI_API_KEY:AIzaSyABaMRAbypXDyxv0dOoQb0DvO2aGcAgO7k}
        embedding:
          api-key: ${GEMINI_API_KEY:AIzaSyABaMRAbypXDyxv0dOoQb0DvO2aGcAgO7k}
          text:
            options:
              model: text-embedding-004
        chat:
          options:
            model: gemini-2.5-flash

    # OpenAI auto-config вимкнено — ми керуємо бінами вручну (Groq, GitHub, Mistral)
    openai:
      api-key: "disabled"
      chat:
        enabled: false
      embedding:
        enabled: false

    retry:
      max-attempts: 2
      initial-interval: 3000
      multiplier: 2.0
      max-interval: 10000

    # Ключ для Groq (безкоштовний провайдер)
    groq:
      api-key: ${GROQ_API_KEY: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}
      
    github:
      api-key: ${GITHUB_TOKEN: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}
      
    mistralai:
      api-key: ${MISTRAL_API_KEY:QjnXYGwjeawhXw6mmX0cEKBOg8ShG5WV}

  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: vasyl.karpliak.pp.2022@lpnu.ua
    password: qtwo ylfy fttu bgzr
    imap:
      host: imap.gmail.com
      port: 993
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

