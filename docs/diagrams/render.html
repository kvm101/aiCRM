<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>aiCRM — Use Case Diagrams</title>
  <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f8f9fa; }
    h1 { font-size: 1.5rem; }
    h2 { margin-top: 2.5rem; font-size: 1.2rem; }
    .diagram { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; overflow: auto; margin: 1rem 0; }
    img { max-width: 100%; height: auto; }
    p.hint { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>aiCRM — UML Use Case Diagrams</h1>
  <p class="hint">Відкрийте цей файл у браузері. ПКМ на зображенні → «Зберегти як» для PNG у презентацію.</p>

  <h2>1. Повна система</h2>
  <div class="diagram" id="d-full"></div>

  <h2>2. Слайд — CRM та комунікації</h2>
  <div class="diagram" id="d-crm"></div>

  <h2>3. Слайд — AI та знання</h2>
  <div class="diagram" id="d-ai"></div>

  <script>
    const diagrams = {
      'd-full': `use-case-full.puml`,
      'd-crm': `use-case-slide-crm.puml`,
      'd-ai': `use-case-slide-ai.puml`
    };

    async function render(id, file) {
      const res = await fetch(file);
      const source = await res.text();
      const encoded = plantumlEncoder.encode(source);
      const url = 'https://www.plantuml.com/plantuml/svg/' + encoded;
      document.getElementById(id).innerHTML =
        '<img alt="' + file + '" src="' + url + '" />';
    }

    Object.entries(diagrams).forEach(([id, file]) => render(id, file));
  </script>
</body>
</html>
